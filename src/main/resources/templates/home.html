<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호텔 파이오니어</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px 60px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 16px;
        }

        p {
            font-size: 20px;
            margin: 0;
            color: #f0f0f0;
        }

        .button {
            display: inline-block;
            margin-top: 28px;
            padding: 12px 24px;
            border-radius: 999px;
            background: white;
            color: #1e3c72;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>환영합니다~!</h1>
    <p>호텔 파이오니어에 오신 것을 환영합니다.</p>
    <a class="button" th:href="@{/}">시작하기</a>
</div>
</body>
</html>
